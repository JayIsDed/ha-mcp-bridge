[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-mcp-bridge"
version = "0.1.0"
description = "MCP server bridging Home Assistant + InfluxDB to Claude. Observation-first, scoped actuation via allowlist."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JayIsDed" }]
dependencies = [
    "mcp>=1.2.0",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
ha-mcp-bridge = "ha_mcp_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_mcp_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
